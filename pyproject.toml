[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "jsleakhunter"
version = "1.0.0"
description = "Defensive JavaScript secret and credential scanner"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name="Mr Dinesh Pathro", email=""}]
dependencies = ["rich>=13.7", "httpx>=0.27", "PyYAML>=6.0"]
[project.scripts]
jsleakhunter = "jsleakhunter.cli:main"
[tool.pytest.ini_options]
addopts = "-q"
